<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/>
      <stop offset="1" stop-color="#1b1d23"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f6"/>
      <stop offset="1" stop-color="#b9bcc4"/>
    </linearGradient>
  </defs>
  <!-- Background tile -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <!-- Pedals: clutch, brake (accent), throttle -->
  <g fill="#9aa0ab">
    <rect x="30" y="88" width="16" height="22" rx="5"/>
    <rect x="77" y="84" width="20" height="26" rx="5"/>
  </g>
  <rect x="52" y="88" width="18" height="22" rx="5" fill="#ff7a1a"/>
  <g fill="#1b1d23" opacity="0.35">
    <rect x="33" y="94" width="10" height="2.5" rx="1.25"/>
    <rect x="33" y="100" width="10" height="2.5" rx="1.25"/>
    <rect x="55" y="94" width="12" height="2.5" rx="1.25"/>
    <rect x="55" y="100" width="12" height="2.5" rx="1.25"/>
    <rect x="80" y="91" width="14" height="2.5" rx="1.25"/>
    <rect x="80" y="97" width="14" height="2.5" rx="1.25"/>
    <rect x="80" y="103" width="14" height="2.5" rx="1.25"/>
  </g>
  <!-- Steering wheel, turned slightly as if understeering into a corner -->
  <g transform="rotate(-14 64 50)">
    <circle cx="64" cy="50" r="31" fill="none" stroke="url(#rim)" stroke-width="10"/>
    <rect x="61" y="14" width="6" height="11" rx="2" fill="#ff7a1a"/>
    <g stroke="#c9ccd3" stroke-width="8" stroke-linecap="round">
      <line x1="38" y1="52" x2="56" y2="52"/>
      <line x1="72" y1="52" x2="90" y2="52"/>
      <line x1="64" y1="60" x2="64" y2="76"/>
    </g>
    <circle cx="64" cy="52" r="11" fill="#2b2f38" stroke="#c9ccd3" stroke-width="4"/>
    <circle cx="64" cy="52" r="4" fill="#ff7a1a"/>
  </g>
</svg>
