name: Release AppImage

# Push a tag like v1.0.3 to build the AppImage and publish a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build AppImage
        run: ./build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" SimPower-x86_64.AppImage \
            --title "$GITHUB_REF_NAME" --generate-notes
