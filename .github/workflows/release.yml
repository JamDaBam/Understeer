name: Release AppImage

# Push a tag like v1.0.3 to build the AppImage and publish a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test        # no release if a test fails
    runs-on: ubuntu-26.04   # fixed, so an image change never breaks a build unnoticed
    steps:
      - uses: actions/checkout@v5

      # From the metainfo file; stops here if they weren't written yet.
      - name: Release notes
        run: python3 tools/release_notes.py "$GITHUB_REF_NAME" > release-notes.md

      - name: Build AppImage
        env:
          VERSION: ${{ github.ref_name }}
        run: ./build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Understeer-*-x86_64.AppImage Understeer-*-x86_64.AppImage.zsync \
            --title "$GITHUB_REF_NAME" --notes "$(cat release-notes.md)" --generate-notes
