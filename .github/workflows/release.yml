name: Release AppImage

# Push a tag like v1.0.3 to build the AppImage and publish a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test        # no release if a test fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build AppImage
        env:
          VERSION: ${{ github.ref_name }}
        run: ./build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Understeer-*-x86_64.AppImage Understeer-*-x86_64.AppImage.zsync \
            --title "$GITHUB_REF_NAME" --generate-notes
